[package]
name = "plant-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Framework-free soil-moisture core for the M5StickC Plus Earth Unit plant monitor."

[lib]
name = "plant_core"
path = "src/lib.rs"

# Functional-core domain (soil moisture). hex-lint enforces the role + bounded-
# context boundary; effect-audit reads role=domain as the FC purity marker (qhw.25).
[package.metadata.hex-arch]
role = "domain"
context = "plant"

# Pure no_std: the domain pulls in nothing. The ADC, the clock and any storage
# all live behind ports the firmware implements.
[dependencies]

# Host-only. These link std and never reach the Xtensa build (dev-deps are
# excluded from a dependent's compilation).
[dev-dependencies]
proptest = "1"
cucumber = "0.21"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# The Gherkin plumbing test needs its own harness; unit + property tests run
# under the default harness alongside it.
[[test]]
name = "cucumber"
harness = false
