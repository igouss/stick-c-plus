[package]
name = "board-support"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus board-support package: AXP192 power-on, pin map, peripheral bring-up (shared by all three projects)."

[lib]
name = "board_support"
path = "src/lib.rs"

# Board/peripheral bring-up is infrastructure the domain-port adapters build on,
# below the adapters themselves. Enforcement of the role lands with qhw.14.
[package.metadata.hex-arch]
role = "infra"

# The AXP192 power-on that enables the LCD/TFT rails (qhw.20). The thin driver is
# generic over embedded-hal 1.0's I2c, so it names no concrete bus and the internal
# I2C can be shared (embedded-hal-bus, at the composition root) with the MPU6886 and
# BM8563 RTC that sit on the same pins. esp-idf-hal supplies the real I2cDriver the
# `internal_i2c` helper builds; esp-idf-sys names EspError, the bring-up error type.
[dependencies]
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
embedded-hal = "1.0"
