[package]
name = "orientation"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus orientation readout — the MPU6886's gravity vector as three live X/Y/Z bars, the tilt angles, and the resting face, on the shared board platform."
# The readout is the point of this package; a bare `cargo run -p orientation` must choose it.
default-run = "orientation"

[[bin]]
name = "orientation"
path = "src/main.rs"

# The imperative shell's outermost layer: it composes adapters and owns effects, so it is the
# one crate the effect-audit `domain` gate must never tag.
[package.metadata.hex-arch]
role = "composition-root"

[dependencies]
# The std/ESP-IDF stack. esp-idf-svc re-exports -hal and -sys, but all three are named so the
# version floor shows.
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"
# Firmware crates (same workspace): the BSP that powers the LCD rails and drives the MPU6886,
# and the board-generic panel/buzzer/IMU adapters.
board-support = { path = "../../../platform/board-support" }
platform-adapters = { path = "../../../platform/adapters" }
# Shares the one internal I2C bus across bus devices: the AXP192 PMIC and the MPU6886 IMU sit
# on the same two pins and are read from two different threads, so each gets its own
# `MutexDevice` handle over the single controller.
embedded-hal-bus = { version = "0.3", features = ["std"] }
# Gives the shared bus a `'static` home without leaking it, the same way the panel adapter
# homes its pixel buffer.
static_cell = "2"
# Host crates, referenced by path across the two workspaces. platform-runtime is the generic
# render loop + Monotonic clock; platform-core the Tick and the Imu port; the orientation-*
# crates are the transform, the picture, and the sampler — all no_std/std and cross-compile
# to xtensa cleanly.
platform-core = { path = "../../../../platform/platform-core" }
platform-runtime = { path = "../../../../platform/platform-runtime" }
orientation-core = { path = "../../../../apps/orientation/orientation-core" }
orientation-display = { path = "../../../../apps/orientation/orientation-display" }
orientation-shell = { path = "../../../../apps/orientation/orientation-shell" }

[build-dependencies]
# Emits the ESP-IDF sysenv link/search flags for the final link (via ldproxy).
embuild = "0.33"
