[package]
name = "pomodoro"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus standalone offline pomodoro timer — screen, two buttons, and buzzer, on the shared board platform."
# The timer is the point of this package; a bare `cargo run -p pomodoro` must choose it.
default-run = "pomodoro"

[[bin]]
name = "pomodoro"
path = "src/main.rs"

# A bench tool, not the timer: an acoustic loopback that plays every jingle note on the buzzer
# and listens on the PDM mic, so "the chime is audible" is falsifiable on-device instead of by
# ear alone. Lives in this package (not its own crate) for the same reason plant-monitor's bench
# tools do — `.cargo/config.toml` pins ESP_IDF_SYS_ROOT_CRATE, and a sibling crate would lose it.
[[bin]]
name = "chime-selftest"
path = "src/chime_selftest.rs"

# The imperative shell's outermost layer: it composes adapters and owns effects, so it is the
# one crate the effect-audit `domain` gate must never tag.
[package.metadata.hex-arch]
role = "composition-root"

[dependencies]
# The std/ESP-IDF stack. esp-idf-svc re-exports -hal and -sys, but all three are named so the
# version floor shows.
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"
# Firmware crates (same workspace): the BSP that powers the LCD rails and drives the MPU6886,
# and the board-generic panel/button/buzzer/IMU adapters.
board-support = { path = "../../../platform/board-support" }
platform-adapters = { path = "../../../platform/adapters" }
# Shares the one internal I2C bus across bus devices: the AXP192 PMIC and the MPU6886 IMU sit
# on the same two pins and are read from two different threads, so each gets its own
# `MutexDevice` handle over the single controller.
embedded-hal-bus = { version = "0.3", features = ["std"] }
# Gives the shared bus a `'static` home without leaking it, the same way the panel adapter
# homes its pixel buffer.
static_cell = "2"
# Host crates, referenced by path across the two workspaces. platform-runtime is the generic
# render loop + Monotonic clock; platform-core the Tick; the pomodoro-* crates are the FSM, the
# picture, and the input shell — all no_std/std and cross-compile to xtensa cleanly.
platform-core = { path = "../../../../platform/platform-core" }
platform-runtime = { path = "../../../../platform/platform-runtime" }
# The pure acoustic analysis for the chime self-test: the acoustic-level (RMS) measure + verdict.
platform-audio = { path = "../../../../platform/platform-audio" }
pomodoro-core = { path = "../../../../apps/pomodoro/pomodoro-core" }
pomodoro-display = { path = "../../../../apps/pomodoro/pomodoro-display" }
pomodoro-shell = { path = "../../../../apps/pomodoro/pomodoro-shell" }

[build-dependencies]
# Emits the ESP-IDF sysenv link/search flags for the final link (via ldproxy).
embuild = "0.33"
