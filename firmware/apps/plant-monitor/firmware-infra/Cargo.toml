[package]
name = "firmware-infra"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Plant-monitor firmware infrastructure: the ESPHome _esphomelib._tcp mDNS advertiser for Home Assistant discovery. Board-generic WiFi lives in the shared firmware/platform/net crate; this keeps only the ESPHome-specific mDNS (which pulls the espressif/mdns managed component)."

[lib]
name = "firmware_infra"
path = "src/lib.rs"

# WiFi / mDNS / socket-host / OTA are infrastructure services, not domain-port
# adapters. Enforcement of the role lands with qhw.14.
[package.metadata.hex-arch]
role = "infra"

# The mDNS advertiser (qhw.8) needs the `espressif/mdns` managed component: mDNS
# was removed from the core ESP-IDF tree in 5.0 and now lives in the Component
# Registry (idf >= 5.0). esp-idf-sys reads this table from the root binary crate
# AND its direct dependencies — firmware-infra is a direct dep of plant-monitor —
# synthesizes the idf_component.yml, and links the component so
# `esp_idf_svc::mdns` resolves. Pinned for reproducibility (1.11.3 is latest;
# 1.8.2 is the tested stable this was built against).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

# The mDNS advertiser (qhw.8) is live. The native-API server host (qhw.27) landed as
# the portable host crate `esphome-server`, not here (it needs only std, no
# esp-idf-svc). OTA (qhw.12) is the remaining service and arrives in its own bead.
[dependencies]
# The std/ESP-IDF stack (see kb/sources/rust-on-esp-idf.md). esp-idf-svc supplies the
# mDNS service (EspMdns); -sys supplies EspError. Named so the version floor stays
# visible next to the -svc that re-exports it, matching the composition root. (The
# WiFi modem peripheral and its -hal moved out with wifi.rs to the shared `net` crate.)
esp-idf-svc = "0.52"
esp-idf-sys = "0.37"
log = "0.4"
