[package]
name = "claude-buddy"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus desk pet that lives off Claude Code approvals — a bonded BLE Nordic UART link, a pixel-art creature on the glass, and approve/deny on the two buttons."
# The buddy is the point of this package; a bare `cargo run -p claude-buddy` must choose it.
default-run = "claude-buddy"

[[bin]]
name = "claude-buddy"
path = "src/main.rs"

# The imperative shell's outermost layer: it composes adapters and owns effects, so it is the
# one crate the effect-audit `domain` gate must never tag.
[package.metadata.hex-arch]
role = "composition-root"

[dependencies]
# The std/ESP-IDF stack. esp-idf-svc re-exports -hal and -sys, but all three are named so the
# version floor shows.
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"
# The BLE peripheral. A safe wrapper over the NimBLE host ESP-IDF already bundles, so the GATT
# server, LE Secure Connections bonding, and the passkey callback are reachable without `unsafe`
# in this crate. Pairs with esp-idf-svc 0.52, which is what the rest of this workspace is on.
esp32-nimble = "0.12"
# Heap readings — a reboot loop on this board is an allocation failure, and these counters are
# what predict one. They exist only as ESP-IDF C functions, so they are read through the one
# crate that owns that `unsafe`.
esp-metrics = { path = "../../../platform/esp-metrics" }
# The hardware RNG behind the per-pairing passkey. Same containment as esp-metrics: exactly one
# crate in this workspace is allowed to speak C for it.
esp-entropy = { path = "../../../platform/esp-entropy" }
# The board: the AXP192 PMIC that powers the LCD rails, the MPU6886 IMU, and the board-generic
# panel / button / IMU adapters the loops are wired to.
board-support = { path = "../../../platform/board-support" }
platform-adapters = { path = "../../../platform/adapters" }
# Shares the one internal I2C bus across bus devices: the AXP192 PMIC and the MPU6886 IMU sit on
# the same two pins and are read from two different threads, so each gets its own `MutexDevice`
# handle over the single controller.
embedded-hal-bus = { version = "0.3", features = ["std"] }
# Gives the shared bus a `'static` home without leaking it, the same way the panel adapter homes
# its pixel buffer.
static_cell = "2"
# Host crates, referenced by path across the two workspaces: the generic render loop and the
# Monotonic clock, the Tick and the ports, the buttons, and the buddy's own domain / picture /
# wire / shell — all of which cross-compile to xtensa unchanged.
platform-core = { path = "../../../../platform/platform-core" }
platform-input = { path = "../../../../platform/platform-input" }
platform-runtime = { path = "../../../../platform/platform-runtime" }
buddy-core = { path = "../../../../apps/buddy/buddy-core" }
buddy-display = { path = "../../../../apps/buddy/buddy-display" }
buddy-shell = { path = "../../../../apps/buddy/buddy-shell" }

[build-dependencies]
# Emits the ESP-IDF sysenv link/search flags for the final link (via ldproxy).
embuild = "0.33"
