[build]
# std/ESP-IDF target (was xtensa-esp32-none-elf under the no_std esp-hal stack).
target = "xtensa-esp32-espidf"

[target.xtensa-esp32-espidf]
# ldproxy forwards the linker args ESP-IDF's build system emits (via build.rs +
# embuild) to the real linker; a plain linker invocation misses them.
linker = "ldproxy"
# --baud 115200: the board's FT232 is unreliable above this (verified flashing
# qhw.1). Monitor console baud is the ESP-IDF default 115200 and needs no flag.
# --non-interactive: the monitor streams serial straight to stdout instead of
# starting espflash's crossterm input reader, which aborts without a controlling
# TTY ("Failed to initialize input reader") — so `cargo run` works from a pipe,
# CI, or an agent. Reset-on-connect still yields a fresh boot; you forgo only the
# interactive Ctrl-R chip reset.
runner = "espflash flash --monitor --non-interactive --baud 115200"
# esp-idf-sys >= 0.34 assumes a 64-bit time_t; ESP-IDF 5.x is built that way.
rustflags = ["--cfg", "espidf_time64"]

# No prebuilt xtensa std ships with the esp toolchain, so build std from source.
[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32"
# This is a VIRTUAL workspace (members list, no root package), so cargo_metadata's
# `root_package()` is None and esp-idf-sys cannot tell which crate's
# `[package.metadata.esp-idf-sys]` to read — it silently reads none (the "could
# not identify the root crate" error is downgraded to a warning). Name the root
# binary explicitly so esp-idf-sys reads it AND its direct deps, which is how the
# `espressif/mdns` managed component declared in firmware-infra (qhw.8) gets
# pulled into the build. Without this the mdns component is never added and
# `esp_idf_svc::mdns` compiles out.
ESP_IDF_SYS_ROOT_CRATE = "plant-monitor"
# Exact ESP-IDF tag (acceptance: pin an exact v5.3.x). esp-idf-sys 0.37.0's
# CHANGELOG deprecates all IDF < 5.3.0, i.e. the floor is v5.3.0 and it supports
# 5.3.x/5.4.x/5.5.x; v5.3.3 is the latest 5.3 patch, on the floor's own line.
ESP_IDF_VERSION = "v5.3.3"
ESP_LOG = "info"
