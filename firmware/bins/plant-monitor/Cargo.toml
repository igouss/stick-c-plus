[package]
name = "plant-monitor"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
# The plant-monitor composition root (bin #1). It wires the driven `adapters` to
# the host domain crates by path across the workspace boundary. The ADC
# SoilSensor adapter is live (qhw.5); WiFi, the native-API host, the sampler
# thread and the Sensor entity follow in qhw.7 / .8 / .9 / .21 / .27.
description = "M5StickC Plus + Earth Unit soil-moisture plant monitor (ESPHome-native)."

[[bin]]
name = "plant-monitor"
path = "src/main.rs"

# A bench tool, not part of the monitor: it answers whether the AXP192's EXTEN bit
# gates the Grove 5 V rail, which decides whether probe power-gating (qhw.31) is a
# firmware change or a hardware one. Lives in this package rather than its own
# crate because `.cargo/config.toml` pins ESP_IDF_SYS_ROOT_CRATE to `plant-monitor`
# — a sibling crate would silently lose the `espressif/mdns` managed component.
[[bin]]
name = "probe-rail-check"
path = "src/probe_rail_check.rs"

# A second bench tool: paints RGB bands through the production display init, so the
# panel's colour order is falsifiable. White-on-black text cannot reveal a red/blue
# swap, which is how a wrong ColorOrder hid until the first coloured pixel shipped.
[[bin]]
name = "display-colour-check"
path = "src/display_colour_check.rs"

# The imperative shell's outermost layer: it composes adapters and owns effects,
# so it is the one crate the effect-audit `domain` gate must never tag.
[package.metadata.hex-arch]
role = "composition-root"

[dependencies]
# The std/ESP-IDF stack (see kb/sources/rust-on-esp-idf.md). esp-idf-svc
# re-exports -hal and -sys, but all three are named so the version floor shows.
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"
# Host crates, referenced by path across the two workspaces — the same
# cross-workspace seam every downstream bead relies on. plant-core is no_std and
# zero-dep; plant-shell adds only std (threads, Arc/Mutex), so both cross-compile
# for xtensa cleanly (esp-idf maps std::thread onto a FreeRTOS task).
plant-core = { path = "../../../plant-core" }
# The imperative shell: the shared moisture cache + the sampler thread. The
# composition root builds the real EarthUnit adapter and hands it to
# `spawn_sampler`; the shell's staleness + panic-isolation rules are host-tested
# there, so this bin stays pure wiring.
plant-shell = { path = "../../../plant-shell" }
# The native-API core (context=api): the `SensorDevice` this root composes and the
# `DeviceInfoResponse`/`SensorConfig` it fills. Pure + prost-only, cross-compiles
# to xtensa cleanly. This is the plant<->api cross-context wiring the composition
# root exists to do — the two bounded contexts stay isolated in the host workspace.
esphome-api = { path = "../../../esphome-api" }
# The reusable native-API server host (context=api): the blocking accept loop that
# serves the `SensorDevice` on :6053. std::net over lwIP on-device; host-tested via
# the aioesphomeapi oracle, so this bin only binds it and hands it the device.
esphome-server = { path = "../../../esphome-server" }
# The driven adapters (firmware workspace). The composition root reaches for
# `adapters::adc::EarthUnit` to bind the SoilSensor port to real ADC1 hardware, and
# `adapters::st7789::St7789Display` to bind the MoistureDisplay port to the TFT.
adapters = { path = "../../adapters" }
# The board-support package: brings up the internal I2C bus and powers the AXP192
# LCD/TFT rails (qhw.20) — load-bearing for the display, which is dark otherwise.
board-support = { path = "../../board-support" }
# The pure shared kernel. `probe-rail-check` folds its ADC bursts through the same
# `oversampled_mean` the EarthUnit adapter uses, so the raw counts it prints are
# directly comparable with the ones the monitor logs and renders.
firmware-core = { path = "../../../firmware-core" }
# Shares the one internal I2C bus across bus devices; here it hands the AXP192 a
# RefCellDevice so the MPU6886/RTC can join the same bus later without rewiring.
embedded-hal-bus = "0.3"
# Firmware infrastructure (same workspace): WiFi STA bring-up (qhw.7). The
# composition root takes the modem + system event loop + NVS and hands them to
# `firmware_infra::wifi::WifiStation` so the board joins the network before the
# native-API server (qhw.27) needs the link.
firmware-infra = { path = "../../firmware-infra" }

[build-dependencies]
# Emits the ESP-IDF sysenv link/search flags for the final link (via ldproxy).
embuild = "0.33"
