[package]
name = "firmware-infra"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus firmware infrastructure: WiFi STA, mDNS, the native-API socket server host, and OTA (shared by all three projects)."

[lib]
name = "firmware_infra"
path = "src/lib.rs"

# WiFi / mDNS / socket-host / OTA are infrastructure services, not domain-port
# adapters. Enforcement of the role lands with qhw.14.
[package.metadata.hex-arch]
role = "infra"

# The mDNS advertiser (qhw.8) needs the `espressif/mdns` managed component: mDNS
# was removed from the core ESP-IDF tree in 5.0 and now lives in the Component
# Registry (idf >= 5.0). esp-idf-sys reads this table from the root binary crate
# AND its direct dependencies — firmware-infra is a direct dep of plant-monitor —
# synthesizes the idf_component.yml, and links the component so
# `esp_idf_svc::mdns` resolves. Pinned for reproducibility (1.11.3 is latest;
# 1.8.2 is the tested stable this was built against).
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.8.2" }

# WiFi STA (qhw.7) and the mDNS advertiser (qhw.8) are live; the native-API server
# host (qhw.27) and OTA (qhw.12) arrive in their own beads, pulling esphome-api
# (by path) then.
[dependencies]
# The std/ESP-IDF stack (see kb/sources/rust-on-esp-idf.md). esp-idf-svc supplies
# the WiFi service (EspWifi/BlockingWifi), the system event loop and NVS; -hal
# supplies the modem peripheral the station is built over; -sys supplies EspError.
# All three are named so the version floor stays visible next to the -svc that
# re-exports them, matching the composition root.
esp-idf-svc = "0.52"
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
log = "0.4"

# The WiFi credentials are baked in at build time from the git-ignored
# firmware/secrets.toml (qhw.7); build.rs parses it with these host-side deps.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
