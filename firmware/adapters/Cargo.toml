[package]
name = "adapters"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus domain-port adapters: adc, st7789, wifi, clock, ws2812 — the driven side of the hexagon."

[lib]
name = "adapters"
path = "src/lib.rs"

# Driven adapters: each implements a host-crate domain port (SoilSensor,
# LedOutput, Clock, ...) against real esp-idf-hal peripherals. Enforcement of the
# role lands with qhw.14.
[package.metadata.hex-arch]
role = "driven-adapter"

# The Clock re-home (qhw.15), the WS2812 RMT encoder (qqh.1) and the ST7789
# display arrive in their own beads, pulling their peripherals then.
[dependencies]
# The host domain crate whose SoilSensor port the `adc` adapter implements,
# referenced by path across the host/firmware workspace seam. plant-core is
# no_std + zero-dep, so it builds on every target — including the host, where the
# `oversample` reduction is unit-tested.
plant-core = { path = "../../plant-core" }

# The ESP-IDF HAL only exists on-target, and its -sys build script rejects any
# other target, so it is gated to `espidf` — mirroring the `adc` module gate in
# lib.rs. This is what keeps an off-target `cargo test` (the pure `oversample`
# reduction) from dragging in the on-target HAL. esp-idf-hal supplies the oneshot
# ADC driver the adapter wraps; esp-idf-sys is named alongside it only for
# `EspError` (the adapter's port error type), so its version floor stays visible.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
