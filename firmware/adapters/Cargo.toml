[package]
name = "adapters"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "M5StickC Plus plant-specific driven adapters: adc, probe-power (clock and ws2812 to come). The board-generic panel/button/buzzer adapters live in platform-adapters."

[lib]
name = "adapters"
path = "src/lib.rs"

# Driven adapters: each implements a host-crate domain port (SoilSensor,
# LedOutput, Clock, ...) against real esp-idf-hal peripherals. Enforcement of the
# role lands with qhw.14.
[package.metadata.hex-arch]
role = "driven-adapter"

# The Clock re-home (qhw.15) and the WS2812 RMT encoder (qqh.1) arrive in their own
# beads, pulling their peripherals then.
[dependencies]
# Host crates, referenced by path across the host/firmware workspace seam; both
# are no_std and cross-compile to xtensa cleanly. plant-core owns the SoilSensor
# port the `adc` adapter implements; firmware-core owns the pure oversampling
# reduction and the ProbePower gating port the adapter composes — each host-tested
# there, so this crate stays a thin on-target shell.
plant-core = { path = "../../plant-core" }
firmware-core = { path = "../../firmware-core" }
# The ESP-IDF HAL supplies the oneshot ADC driver the `adc` adapter wraps;
# esp-idf-sys is named alongside it for `EspError` (the adapters' port error
# type), so its version floor stays visible next to the -hal it re-exports.
esp-idf-hal = "0.46"
esp-idf-sys = "0.37"
