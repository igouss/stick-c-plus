# M5StickC Plus FIRMWARE workspace — detached from the host workspace above.
#
# Carved into small single-responsibility crates so the hexagon / Functional-
# Core–Imperative-Shell boundaries are enforceable per crate. The role tags below
# are DECLARED now; the mechanical gate that reads them lands with qhw.14.
#
#   board-support/      infra          — M5StickC Plus BSP (AXP192 power-on, pin
#                                        map, peripheral bring-up); all 3 projects.
#   firmware-infra/     infra          — WiFi STA, mDNS, OTA; all 3 projects.
#                                        (the native-API server host is the portable
#                                        host crate `esphome-server`, not here.)
#   adapters/           driven-adapter — domain-port adapters (adc, st7789,
#                                        clock, ws2812) implementing host ports.
#   bins/plant-monitor/ composition-root — bin #1; wires adapters to the host
#                                        crates (plant-core, esphome-api) by path.
#
# Detached (own `[workspace]`, `exclude`d up top) so its Xtensa target and `esp`
# toolchain (rust-toolchain.toml) never touch the host `cargo test`.
[workspace]
resolver = "2"
members = ["board-support", "firmware-infra", "adapters", "bins/plant-monitor"]

# Profiles live at the (virtual) workspace root; members may not set their own.
# opt-level "s" everywhere — `-O0` overflows IRAM on the esp32.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = "s"
