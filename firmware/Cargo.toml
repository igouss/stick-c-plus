# M5StickC Plus FIRMWARE workspace — detached from the host workspace above.
#
# Carved into small single-responsibility crates so the hexagon / Functional-
# Core–Imperative-Shell boundaries are enforceable per crate, and organized to mirror the
# host workspace: a reusable `platform/` foundation and one directory per app under `apps/`.
#
#   platform/adapters/        driven-adapter — board-generic adapters (ST7789 panel +
#                                              PanelScreen, buttons, buzzer); every app.
#   platform/board-support/   infra          — M5StickC Plus BSP (AXP192, I2C); every app.
#   platform/net/             infra          — shared WiFi STA + DNS resolve; every networked app.
#   platform/esp-metrics/     infra          — heap counters; a crate allowed `unsafe`.
#   platform/dma-mem/         infra          — DMA-capable buffers; a crate allowed `unsafe`.
#   apps/plant-monitor/adapters/     driven-adapter — the plant adc + probe-power adapters.
#   apps/plant-monitor/firmware-infra/ infra        — ESPHome mDNS advertiser (plant only).
#   apps/plant-monitor/bin/   composition-root — the plant-monitor (crate name "plant-monitor").
#   apps/host-monitor/adapters/ driven-adapter — the HTTP hostpulse PulseSource.
#   apps/host-monitor/bin/    composition-root — the host monitor (crate name "host-monitor").
#   apps/pomodoro/bin/        composition-root — the standalone pomodoro timer.
#   apps/orientation/bin/     composition-root — the live IMU orientation readout.
#   apps/generative-art/bin/  composition-root — the button-cycled generative-art gallery.
#   apps/buddy/bin/           composition-root — the Claude Code desk pet (BLE Nordic UART).
#
# Detached (own `[workspace]`, `exclude`d up top) so its Xtensa target and `esp`
# toolchain (rust-toolchain.toml) never touch the host `cargo test`.
[workspace]
resolver = "2"
members = [
    "platform/adapters",
    "platform/board-support",
    "platform/net",
    "platform/esp-metrics",
    "platform/dma-mem",
    "platform/esp-entropy",
    "apps/plant-monitor/adapters",
    "apps/plant-monitor/firmware-infra",
    "apps/plant-monitor/bin",
    "apps/host-monitor/adapters",
    "apps/host-monitor/bin",
    "apps/pomodoro/bin",
    "apps/orientation/bin",
    "apps/generative-art/bin",
    "apps/buddy/bin",
]

# Profiles live at the (virtual) workspace root; members may not set their own.
#
# opt-level = 3 for release: the apps are small, so the extra flash `.text` is affordable (Rust app
# code lands in flash, not the tight IRAM the `-O0` warning below is about), and under `lto = "fat"`
# the ROOT opt-level is the one that actually reaches the hot path — a per-package override is washed
# out by the final whole-graph LTO pass (measured). This compiles the plume's field loop for speed,
# not size — and, measured on the board, its tighter codegen also lifted the render loop off a
# flash-i-cache thrash the "s" layout had fallen into (95 ms → 32 ms/frame, steady). `-O0` still
# overflows IRAM on the esp32, so dev stays at "s".
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = "s"
