[package]
name = "pomodoro-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Host-testable imperative shell for the pomodoro timer: the shared timer cache and the input thread that polls the buttons, debounces them, folds the gestures through the pure FSM, and sounds the transition jingles. std-linked but device-independent."

[lib]
name = "pomodoro_shell"
path = "src/lib.rs"

# A driving (primary) adapter: the input loop turns button gestures and the passage of time
# into calls on the pure pomodoro `step`, reading the Button/Clock ports and driving the Tone
# port (all injected by the composition root). It may depend only on domain / usecase /
# port-and-adapter — here pomodoro-core and platform-core (both domain). context = "pomodoro".
[package.metadata.hex-arch]
role = "driving-adapter"
context = "pomodoro"

[dependencies]
# The pure FSM: the Timer, the `step` use case, and the Jingle the shell sounds.
pomodoro-core = { path = "../pomodoro-core" }
# The board-generic ports the loop drives: Clock, Tone, Backlight.
platform-core = { path = "../../../platform/platform-core" }
# The buttons: the two ports, the gesture recognizer, and the event stream the loop folds.
platform-input = { path = "../../../platform/platform-input" }
# The shell logs a buzzer failure so a dead speaker is observable; inert without a logger.
log = "0.4"
