[package]
name = "art-display"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Device-independent rendering of the generative-art gallery: it turns a Sketch plus an elapsed clock into pixels, plotting into one offscreen Rgb565 frame and blitting it to any embedded-graphics DrawTarget in a single addressed window — so the same code drives the ST7789 and a host framebuffer, and a full-screen animation costs one SPI transaction a frame. The gallery's view carries the selected sketch so a switch resets the animation clock; the render dispatches on the sketch."

[lib]
name = "art_display"
path = "src/lib.rs"

# The seam between the generative-art domain and the graphics port: it turns the selected sketch
# and the elapsed clock the render loop hands it into pixels, through the board-generic
# platform-display foundation. port-and-adapter may depend on domain (art-core, plume-core,
# platform-core, platform-numerics) and other port-and-adapter crates (platform-display).
# context = "generative-art".
[package.metadata.hex-arch]
role = "port-and-adapter"
context = "generative-art"

[dependencies]
# The gallery domain: the Sketch the render dispatches on and the running order it belongs to.
art-core = { path = "../art-core" }
# The plume domain: the field the plume sketch projects, its phase clock, and FRAME_MS.
plume-core = { path = "../plume-core" }
# The squares domain: the breathing grid the squares sketch rasterises, and its phase clock.
squares-core = { path = "../squares-core" }
# The fan domain: the folding triangles the fan sketch projects and colours, and its phase clock.
fan-core = { path = "../fan-core" }
# The board-generic kernel: the Animated contract the view implements, Tick, and the
# ScreenRotation that decides the canvas shape.
platform-core = { path = "../../../platform/platform-core" }
# The shared sine table every sketch reads its trigonometry from.
platform-numerics = { path = "../../../platform/platform-numerics" }
# The board-generic picture: SCREEN_SIZE, the generic RenderError, and the text primitive the
# not-yet-built sketches draw their honest placeholder through.
platform-display = { path = "../../../platform/platform-display" }
# The graphics port (DrawTarget) plus the Point/Rgb565/Rectangle the frame is blitted through.
embedded-graphics = "0.8"
# `roundf` in no_std: the sketches' rect fills round fractional corners to pixel bounds. libm is
# pure computation — no allocator, no I/O — so it does not make this crate impure.
libm = "0.2"

# Host-only; never reaches the Xtensa build (a dependent excludes dev-deps).
[dev-dependencies]
# The shared golden-screen check: renders every still and asserts it is byte-identical to the
# committed reference PNG, so a change to any sketch's picture fails the build until re-blessed.
golden-screens = { path = "../../../platform/golden-screens" }
# The shared host framebuffer the render tests draw into, counting what escapes the canvas.
platform-display = { path = "../../../platform/platform-display", features = ["testing"] }
# A host framebuffer that saves a PNG — the screenshots example rasterises frames to files.
embedded-graphics-simulator = { version = "0.8", default-features = false }
