[package]
name = "plume-display"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Device-independent rendering of the plume: it projects plume-core's 400×400 point field onto the M5StickC Plus panel, plots it into a one-bit offscreen frame, and blits that frame to any embedded-graphics DrawTarget in a single addressed window — so the same code drives the ST7789 and a host framebuffer, and a full-screen animation costs one SPI transaction a frame instead of five thousand."

[lib]
name = "plume_display"
path = "src/lib.rs"

# The seam between the plume domain and the graphics port: it turns a phase (the elapsed
# clock the render loop hands it) into pixels through the board-generic platform-display
# foundation. port-and-adapter may depend on domain (plume-core, platform-core) and other
# port-and-adapter crates (platform-display). context = "plume".
[package.metadata.hex-arch]
role = "port-and-adapter"
context = "plume"

[dependencies]
# The plume domain: the field it projects, the phase clock it reads the elapsed time through,
# and the sine table it hands the field.
plume-core = { path = "../plume-core" }
# The board-generic kernel: the Animated contract the view implements, Tick, and the
# ScreenRotation that decides the canvas shape.
platform-core = { path = "../../../platform/platform-core" }
# The board-generic picture: SCREEN_SIZE and the generic RenderError. This crate holds only
# the plume-specific projection and frame on top.
platform-display = { path = "../../../platform/platform-display" }
# The graphics port (DrawTarget) plus the Point/Rgb565/Rectangle the frame is blitted through.
embedded-graphics = "0.8"

# Host-only; never reaches the Xtensa build (a dependent excludes dev-deps).
[dev-dependencies]
# The shared host framebuffer the render tests draw into.
platform-display = { path = "../../../platform/platform-display", features = ["testing"] }
# A host framebuffer that saves a PNG — the screenshots example rasterizes frames to files.
embedded-graphics-simulator = { version = "0.8", default-features = false }
