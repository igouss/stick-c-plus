[package]
name = "buddy-daemon-shell"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The async imperative shell of the permission daemon: a single-owner actor that owns the pure buddy-daemon-core Coordinator and drives it against the real world — a UnixListener of per-tool-call hooks, a keepalive tick, and the bonded BLE link's outbound/inbound lines. The Coordinator stays the sole owner behind an mpsc, so there are no locks and no races; every edge is host-tested against an in-memory fake link (the outbound channel). std/tokio, Linux-only."

[lib]
name = "buddy_daemon_shell"
path = "src/lib.rs"

# A driving (primary) adapter: it turns the outside world's events (a hook connecting, a keepalive
# tick, a device line, the link coming up or down) into folds of the pure Coordinator
# (buddy-daemon-core, an ECB Control) and performs the Effects the Control returns. It owns effects
# (the tokio actor task, the unix socket, oneshot/mpsc channels, the interval) but drives inward
# through the Coordinator; the whole permission loop is proven on the host against an in-memory
# outbound channel — no BLE, no device. May depend on domain / port-and-adapter — here
# buddy-daemon-core (the Control) and buddy-permission (the IPC DTOs). context = "buddy".
[package.metadata.hex-arch]
role = "driving-adapter"
context = "buddy"

[dependencies]
# The pure Control this shell runs: the Coordinator that folds each input into an ordered
# Vec<Effect>, with both fail-open hazards closed in effect-free form.
buddy-daemon-core = { path = "../buddy-daemon-core" }
# The hook<->daemon IPC DTOs crossing the unix socket: HookRequest in, DaemonReply out.
buddy-permission = { path = "../buddy-permission" }
# The async runtime: the actor task, the UnixListener, the mpsc/oneshot channels the actor is fed
# through, and the keepalive interval.
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "sync",
    "net",
    "io-util",
    "time",
    "macros",
] }
# The socket codec: a HookRequest JSON line in, a DaemonReply JSON line out — the same shapes the
# hook binary reads and writes.
serde_json = "1"
# A refused connection / malformed request line is logged, not fatal; the composition root installs
# the logger.
log = "0.4"

# Host-only. The integration tests speak the device's wire codec (PermissionResponse) to prove the
# loop end-to-end, and drive a real hook client over a UnixStream — the codec/transport the daemon
# faces, host-side only. No device.
[dev-dependencies]
buddy-wire = { path = "../buddy-wire" }
