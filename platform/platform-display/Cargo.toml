[package]
name = "platform-display"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Board-generic display foundation for the M5StickC Plus: the ClaudePix sprite library, the fixed-width text primitives, the RGB colour self-test, and a shared test framebuffer — drawn into any embedded-graphics DrawTarget, so every app renders on the panel and on a host framebuffer through one code path."

[lib]
name = "platform_display"
path = "src/lib.rs"

# The reusable seam between an app's picture and the graphics port: embedded_graphics'
# DrawTarget is the port, the on-target ST7789 panel and the host framebuffer are two
# adapters for it. Named nothing app-specific, so every context (plant, pomodoro, ...)
# depends on it — hence context = "shared", the one context any crate may depend on.
[package.metadata.hex-arch]
role = "port-and-adapter"
context = "shared"

[features]
# Exposes `testing::Framebuffer` — a pixel-counting host DrawTarget — to dependent
# crates' tests. Off by default, so it never reaches a firmware build.
testing = []

[dependencies]
# The graphics port (DrawTarget) plus the text/primitive drawing we render through.
embedded-graphics = "0.8"
# Each text line is built in a stack buffer, not a heap `format!` — the render path
# must allocate nothing on a 520 KB no-PSRAM chip.
heapless = "0.8"

# Host-only; never reaches the Xtensa build (a dependent excludes dev-deps).
[dev-dependencies]
# A host framebuffer that saves a PNG — used by the `sprites` contact-sheet example.
# `default-features = false` drops the SDL window backend: we rasterize to a file.
embedded-graphics-simulator = { version = "0.8", default-features = false }
proptest = "1"
