# Host workspace: device-independent, host-testable crates, organized as a reusable
# `platform/` foundation and one directory per app under `apps/`. Most are framework-free
# no_std; the imperative shells link std (threads, Arc/Mutex, sockets) but name no hardware,
# so they too are verified on the host and cross-compile to esp-idf std unchanged. The
# firmware is a *detached* workspace (firmware/Cargo.toml has its own [workspace]) so it can
# carry the Xtensa target + `esp` toolchain without forcing them on `cargo test` here.
# Firmware crates depend on these host crates by path across the boundary.
[workspace]
resolver = "2"
members = [
    # platform/ — the reusable, app-agnostic foundation (context = "shared", plus the
    # portable ESPHome native-API crates every network app reuses).
    "platform/platform-core",
    "platform/platform-numerics",
    "platform/platform-audio",
    "platform/platform-input",
    "platform/platform-health",
    "platform/platform-bench",
    "platform/golden-screens",
    "platform/platform-display",
    "platform/platform-runtime",
    "platform/firmware-core",
    "platform/esphome-api",
    "platform/esphome-server",
    # apps/ — one bounded context per app on the shared foundation.
    "apps/buddy/buddy-core",
    "apps/buddy/buddy-wire",
    "apps/buddy/buddy-bridge-core",
    "apps/buddy/buddy-bridge-shell",
    "apps/buddy/buddy-bridge",
    "apps/buddy/buddy-creature",
    "apps/buddy/buddy-display",
    "apps/buddy/buddy-shell",
    "apps/buddy/buddy-daemon-core",
    "apps/buddy/buddy-daemon-shell",
    "apps/buddy/buddy-permission",
    "apps/buddy/buddy-hook",
    "apps/host-monitor/host-core",
    "apps/host-monitor/host-display",
    "apps/host-monitor/host-shell",
    "apps/host-monitor/host-wire",
    "apps/led-driver/led-core",
    "apps/orientation/orientation-core",
    "apps/orientation/orientation-display",
    "apps/orientation/orientation-shell",
    "apps/plume/plume-core",
    "apps/plume/plume-display",
    "apps/plant-monitor/plant-core",
    "apps/plant-monitor/plant-display",
    "apps/plant-monitor/plant-shell",
    "apps/pomodoro/pomodoro-core",
    "apps/pomodoro/pomodoro-display",
    "apps/pomodoro/pomodoro-shell",
]
# The firmware is its own Xtensa workspace; keep it out of the host one.
exclude = ["firmware"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
